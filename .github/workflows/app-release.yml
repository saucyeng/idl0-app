# App release pipeline — see docs/IDL0_SPEC.md §31.1.
#
# On a `v*` tag, builds the signed release APK and publishes it to GitHub
# Releases so it can be downloaded and installed (and later self-updated, §31.2).
#
# The git tag is the version of record: the leading `v` is stripped and passed
# as `--build-name`, so `package_info_plus` at runtime equals the release tag.
# A `-beta`/`-rc` suffix publishes as a GitHub prerelease. Exactly one `.apk`
# plus its `.sha256` sidecar (sha256sum format) per release.
#
# Signing: the APK is signed with the repo's existing `idl0` cert so it installs
# over any prior build with no uninstall. The keystore is NOT committed — CI
# restores it from the `ANDROID_KEYSTORE_B64` secret (base64 of
# ~/.android/idl0-dev.jks). Its passwords live in android/app/build.gradle.kts.
#
# First-run shakedown: `flutter build apk` cross-compiles the idl-rs engine for
# Android via cargokit (Rust toolchain + Android NDK). ubuntu-latest ships both;
# if the NDK version gradle wants is absent it is fetched automatically. The
# build command itself is verified — it is what produces local release APKs.
name: app-release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub Release + upload assets

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Restore signing keystore
        run: |
          mkdir -p "$HOME/.android"
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > "$HOME/.android/idl0-dev.jks"

      - name: Build release APK (arm64)
        working-directory: app
        run: flutter build apk --release --target-platform android-arm64 --build-name="$VERSION"

      - name: Stage release assets
        run: |
          mkdir dist
          cp app/build/app/outputs/flutter-apk/app-release.apk "dist/idl0-app-v${VERSION}.apk"
          cd dist
          sha256sum "idl0-app-v${VERSION}.apk" > "idl0-app-v${VERSION}.apk.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true

  # Linux: a single self-contained AppImage (download, chmod +x, double-click).
  # No signing; integrity via the published .sha256 (§31.1/§31.2).
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Linux build deps
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libfuse2

      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build Linux
        working-directory: app
        run: flutter build linux --release --build-name="$VERSION"

      - name: Package AppImage
        run: |
          set -euo pipefail
          BUNDLE="app/build/linux/x64/release/bundle"
          APPDIR="AppDir"
          mkdir -p "$APPDIR/usr/bin"
          cp -r "$BUNDLE"/. "$APPDIR/usr/bin/"
          cp app/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png "$APPDIR/idl0.png"
          printf '[Desktop Entry]\nType=Application\nName=IDL0\nExec=idl0\nIcon=idl0\nCategories=Utility;\n' > "$APPDIR/idl0.desktop"
          printf '#!/bin/bash\nHERE="$(dirname "$(readlink -f "${0}")")"\nexec "$HERE/usr/bin/idl0" "$@"\n' > "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" -O appimagetool
          chmod +x appimagetool
          mkdir -p dist
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run "$APPDIR" "dist/idl0-app-v${VERSION}-x86_64.AppImage"
          ( cd dist && sha256sum "idl0-app-v${VERSION}-x86_64.AppImage" > "idl0-app-v${VERSION}-x86_64.AppImage.sha256" )

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true

  # Windows: a zip of the release bundle (unzip, run idl0.exe). No signing —
  # SmartScreen may warn on first run; Authenticode can be added later.
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build Windows
        working-directory: app
        run: flutter build windows --release --build-name="$VERSION"

      - name: Package zip
        run: |
          set -euo pipefail
          mkdir -p dist
          ( cd app/build/windows/x64/runner/Release && 7z a "$GITHUB_WORKSPACE/dist/idl0-app-v${VERSION}-windows-x64.zip" . >/dev/null )
          ( cd dist && sha256sum "idl0-app-v${VERSION}-windows-x64.zip" > "idl0-app-v${VERSION}-windows-x64.zip.sha256" )

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
