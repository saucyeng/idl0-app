# Deploys the software.saucyeng.com download page (site/) to GitHub Pages.
#
# One-time setup (done in the repo, not here):
#   1. DNS at saucyeng.com's host:  CNAME  software → saucyeng.github.io
#   2. repo Settings → Pages → Source: "GitHub Actions"
# The custom domain comes from site/CNAME. The page reads the latest release
# live from the GitHub API in the browser, so it never needs a redeploy when a
# new app release is cut — only edits under site/ (or to this file) trigger it.
name: pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
